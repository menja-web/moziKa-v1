<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MoziKa Admin</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f3f6fc;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    h1 { text-align: center; color: #4a90e2; margin-bottom: 30px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat {
      background: white;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      padding: 20px;
      text-align: center;
    }
    .stat h2 {
      margin-bottom: 10px;
      font-size: 1.1rem;
      color: #555;
    }
    .stat p {
      font-size: 1.8rem;
      font-weight: bold;
      color: #4a90e2;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 10px 14px;
      border-bottom: 1px solid #eee;
      font-size: 0.95rem;
    }
    th {
      background: #4a90e2;
      color: white;
      text-align: left;
    }
    tr:hover td { background: #f0f4fa; }
    button.del {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    button.del:hover {
      background: #c0392b;
    }
  </style>
</head>
<body>

<h1>🛠️ Tableau de bord Admin – MoziKa</h1>

<div class="stats" id="statsPanel">
  <div class="stat"><h2>👥 Utilisateurs actifs</h2><p id="usersActifs">—</p></div>
  <div class="stat"><h2>🧑‍🎤 Artistes</h2><p id="artistes">—</p></div>
  <div class="stat"><h2>🎶 Musiques</h2><p id="musiques">—</p></div>
  <div class="stat"><h2>🎧 Écoutes</h2><p id="ecoutes">—</p></div>
  <div class="stat"><h2>📥 Téléchargements</h2><p id="downloads">—</p></div>
</div>

<h2>🎵 Liste des musiques</h2>
<table id="musicsTable">
  <thead>
    <tr>
      <th>Titre</th>
      <th>Artiste</th>
      <th>Genre</th>
      <th>📅 Date</th>
      <th>🎧 Écoutes</th>
      <th>📥 Téléchargements</th>
      <th>🗑️</th>
    </tr>
  </thead>
  <tbody><tr><td colspan="7">Chargement…</td></tr></tbody>
</table>

<script>
  async function loadStats() {
    const res = await fetch('/api/admin/stats');
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById('usersActifs').textContent = data.usersActifs || 0;
    document.getElementById('artistes').textContent = data.artistes || 0;
    document.getElementById('musiques').textContent = data.musiques || 0;
    document.getElementById('ecoutes').textContent = data.totalEcoutes || 0;
    document.getElementById('downloads').textContent = data.totalTelechargements || 0;
  }

  async function loadMusics() {
    const res = await fetch('/api/admin/musics');
    const data = await res.json();
    const tbody = document.querySelector('#musicsTable tbody');
    if (!Array.isArray(data.musics) || data.musics.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7">Aucune musique disponible.</td></tr>';
      return;
    }
    data.musics.sort((a,b)=>(b.listenCount||0)-(a.listenCount||0));
    tbody.innerHTML = '';
    data.musics.forEach(m => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${m.title}</td>
        <td>${m.uploader||'Anonyme'}</td>
        <td>${m.category}</td>
        <td>${(m.uploadedAt||'').split('T')[0]}</td>
        <td>${m.listenCount||0}</td>
        <td>${m.downloadCount||0}</td>
        <td><button class="del" data-id="${m._id}">🗑️</button></td>
      `;
      tbody.appendChild(row);
    });
    document.querySelectorAll('button.del').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        if (!confirm('Confirmer la suppression ?')) return;
        const res = await fetch(`/api/admin/musics/${id}`, { method: 'DELETE' });
        if (res.ok) loadMusics();
      });
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    loadStats();
    loadMusics();
  });
</script>
</body>
</html>
