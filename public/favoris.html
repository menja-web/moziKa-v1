<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>💙 Favoris - MoziKa</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f8fc;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    header {
      background: #4a90e2;
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
      margin-bottom: 30px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 5px;
    }
    ul#favoriteList {
      list-style: none;
      padding: 0;
      max-width: 800px;
      margin: 0 auto;
    }
    ul#favoriteList li {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }
    strong {
      font-size: 1.2rem;
      margin-bottom: 5px;
    }
    .meta {
      font-size: 0.9rem;
      color: #666;
    }
    audio {
      width: 100%;
      margin: 10px 0;
    }
    a.download-link {
      background: #4a90e2;
      color: white;
      text-decoration: none;
      padding: 6px 12px;
      font-weight: bold;
      border-radius: 6px;
      display: inline-block;
      width: fit-content;
    }
    a.download-link:hover {
      background: #357abd;
    }
    button.removeFav {
      margin-top: 8px;
      background: #e53935;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button.removeFav:hover {
      background: #c62828;
    }
    .back-link {
      text-align: center;
      display: block;
      margin-top: 30px;
      text-decoration: none;
      font-weight: bold;
      color: #4a90e2;
    }
  </style>
</head>
<body>
  <header>
    <h1>💙 Mes musiques favorites</h1>
    <p>Retrouve les morceaux que tu aimes 🎶</p>
  </header>

  <ul id="favoriteList">
    <li>Chargement des favoris...</li>
  </ul>

  <a href="accueil.html" class="back-link">← Retour à l’accueil</a>

  <script>
    fetch("/api/favorites")
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById("favoriteList");
        if (!data.favorites || data.favorites.length === 0) {
          list.innerHTML = "<li>Aucune musique en favoris.</li>";
          return;
        }

        list.innerHTML = "";
        data.favorites.forEach(music => {
          const li = document.createElement("li");
          li.innerHTML = `
            <strong>${music.title}</strong>
            <div class="meta">👤 Par ${music.uploader_name || "Inconnu"} • 🎵 ${music.category || "Genre inconnu"}</div>
            <audio controls controlsList="nodownload" src="${music.path}"></audio>
            <a class="download-link" href="${music.path}" download>📥 Télécharger</a>
            <button class="removeFav" data-path="${music.path}">❌ Retirer des favoris</button>
          `;
          list.appendChild(li);

          // ✅ Lecture exclusive : pause les autres
          const player = li.querySelector("audio");
          player.addEventListener("play", () => {
            document.querySelectorAll("audio").forEach(other => {
              if (other !== player) other.pause();
            });
          });
        });

        // 🗑 Gestion du retrait
        document.querySelectorAll(".removeFav").forEach(btn => {
          btn.addEventListener("click", () => {
            const path = btn.dataset.path;
            fetch("/api/remove-favorite", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ path })
            })
            .then(res => res.json())
            .then(result => {
              if (result.status === "success") {
                btn.parentElement.remove();
              }
            })
            .catch(err => console.error("Erreur retrait favori :", err));
          });
        });
      })
      .catch(err => {
        console.error("Erreur chargement favoris :", err);
        document.getElementById("favoriteList").innerHTML = "<li>Erreur de chargement des favoris.</li>";
      });
  </script>
</body>
</html>
