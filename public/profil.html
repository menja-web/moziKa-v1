<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil utilisateur - MoziKa</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    #deleteMessage {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 15px;
    }
    .confirm-box {
      background: white;
      border: 2px solid #4a90e2;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      padding: 15px 20px;
      max-width: 300px;
      margin: 15px auto;
      text-align: center;
      display: none;
      z-index: 99;
    }
    .confirm-box p {
      margin-bottom: 10px;
      font-weight: bold;
      color: #333;
    }
    .confirm-box button {
      margin: 5px 10px;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .confirm-box .yes {
      background-color: #e74c3c;
      color: white;
    }
    .confirm-box .no {
      background-color: #ccc;
      color: #333;
    }
    .music-card {
      position: relative;
    }
    form {
      margin-top: 30px;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    form input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    form button {
      background: #4a90e2;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 6px;
      width: 100%;
      font-weight: bold;
      cursor: pointer;
    }
    #msg {
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- ✅ Message d’action affiché en haut comme dans le Top 5 -->
  <section id="feedbackZone" style="text-align: center; margin-top: 20px;">
    <div id="deleteMessage" style="display: none;"></div>
  </section>

  <header>
    <h1>🎵 MoziKa</h1>
    <nav>
      <a href="./accueil.html">Accueil</a>
      <a href="upload.html">Ajouter une musique</a>
      <a href="#" onclick="logoutUser(); return false;">Déconnexion</a>
    </nav>
  </header>

  <main>
    <h2>Mon Profil</h2>

    <p><strong>👋 Bienvenue :</strong> <span id="username">...</span></p>
    <p><strong>📧 E-mail :</strong> <span id="email">...</span></p>

    <form onsubmit="changePassword(event)">
      <h3 style="text-align: center; color: #4a90e2;">🔒 Modifier mon mot de passe</h3>
      <input type="password" id="oldPass" placeholder="Ancien mot de passe" required />
      <input type="password" id="newPass" placeholder="Nouveau mot de passe" required />
      <button type="submit">Changer</button>
      <p id="msg"></p>
    </form>

    <hr />
    <section>
      <h3>🎶 Tes musiques uploadées</h3>
      <ul id="userMusics"></ul>

      <hr />
      <section>
        <h3>💙 Tes musiques favorites</h3>
        <ul id="userFavorites"></ul>
      </section>
    </section>

    <div class="confirm-box" id="confirmBox">
      <p>🗑 Supprimer cette musique ?</p>
      <button class="yes">Oui, supprimer</button>
      <button class="no">Annuler</button>
    </div>
  </main>


<script>
  let user = null;
  const deleteMsg = document.getElementById("deleteMessage");
  const confirmBox = document.getElementById("confirmBox");
  let targetPath = "", targetCard = null;
  let isRemovingFavorite = false;
// 👇 AJOUTE ICI
function syncListenCount(path, newCount) {
  document.querySelectorAll(".music-card").forEach(card => {
    const audio = card.querySelector("audio");
    if (audio && audio.src.includes(path)) {
      const span = card.querySelector(".listenCount");
      if (span) span.textContent = `🎧 Écoutes : ${newCount}`;
    }
  });
}
  fetch("/api/get-session")
    .then(res => res.json())
    .then(data => {
      if (data.status === "success") {
        user = data.user;
        localStorage.setItem("moziKaUser", JSON.stringify(user));
        document.getElementById("username").textContent = user.username;
        document.getElementById("email").textContent = user.email;
        loadUserMusics();
        loadUserFavorites();
      } else {
        window.location.href = "login.html";
      }
    })
    .catch(err => {
      console.error("Erreur session :", err);
      window.location.href = "login.html";
    });
fetch("/api/musics")
  .then(res => res.json())
  .then(allMusics => {
    const realMusic = allMusics.musics.find(m => m.path === music.path);
    if (realMusic) {
      music.listenCount = realMusic.listenCount;
    }
});

  async function loadUserMusics() {
    try {
      const res = await fetch("/api/musics");
      const data = await res.json();
      const list = document.getElementById("userMusics");
      list.innerHTML = "";

      const musics = data.musics.filter(m => m.uploader_email === user.email);
      if (musics.length === 0) {
        list.innerHTML = "<li style='text-align:center; color:#999;'>Aucune musique uploadée 🎶</li>";
        return;
      }

      musics.forEach(music => {
        const li = document.createElement("li");
        li.className = "music-card";
        li.innerHTML = `
          <strong>${music.title}</strong> (${music.category})<br>
          <img src="${music.cover}" alt="Couverture" width="100" /><br>
          <audio controls controlsList="nodownload" src="${music.path}" style="width:100%; margin:10px 0;"></audio><br>
          <span class="listenCount">🎧 Écoutes : ${music.listenCount}</span><br>
          📥 Téléchargements : ${music.downloadCount}<br>
          <a class="download-link" href="${music.path}" download>📥 Télécharger</a>
          <button class="deleteBtn" data-path="${music.path}">🗑 Supprimer</button>
          <hr>
        `;
        list.appendChild(li);

        const player = li.querySelector("audio");

        player.addEventListener("play", () => {
          document.querySelectorAll("audio").forEach(other => {
            if (other !== player) other.pause();
          });
        });

        let counted = false;
        player.addEventListener("timeupdate", () => {
          if (!counted && player.currentTime >= 15 && player.duration > 0) {
            counted = true;
            fetch("/api/update-listen", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ path: music.path, email: user.email })
            })
            .then(res => res.json())
            .then(data => {
              const countSpan = li.querySelector(".listenCount");
              if (countSpan && data.listenCount !== undefined) {
                countSpan.textContent = `🎧 Écoutes : ${data.listenCount}`;
              }
            })
            .catch(err => console.error("Erreur écoute :", err));
          }
        });
      });
    } catch (err) {
      document.getElementById("userMusics").innerHTML = "<li>Erreur de chargement.</li>";
      console.error(err);
    }
  }
  async function loadUserFavorites() {
    try {
      const res = await fetch("/api/favorites");
      const data = await res.json();
      const list = document.getElementById("userFavorites");
      list.innerHTML = "";

      if (!data.favorites || data.favorites.length === 0) {
        list.innerHTML = "<li>Aucune musique en favoris.</li>";
        return;
      }

      data.favorites.forEach(music => {
        const li = document.createElement("li");
        li.className = "music-card";
        li.innerHTML = `
          <strong>${music.title}</strong> (${music.category})<br>
          <img src="${music.cover}" alt="Couverture" width="100" /><br>
          <audio controls controlsList="nodownload" src="${music.path}" style="width:100%; margin:10px 0;"></audio><br>
          <span class="listenCount">🎧 Écoutes : ${music.listenCount}</span><br>
          📥 Téléchargements : ${music.downloadCount}<br>
          <a class="download-link" href="${music.path}" download>📥 Télécharger</a><br>
          <button class="removeFavBtn" data-path="${music.path}">❌ Retirer des favoris</button>
          <hr>
        `;
        list.appendChild(li);

        const player = li.querySelector("audio");

        player.addEventListener("play", () => {
          document.querySelectorAll("audio").forEach(other => {
            if (other !== player) other.pause();
          });
        });

        let counted = false;
        player.addEventListener("timeupdate", () => {
          if (!counted && player.currentTime >= 15 && player.duration > 0) {
            counted = true;
            fetch("/api/update-listen", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ path: music.path, email: user.email })
            })
            .then(res => res.json())
            .then(data => {
              const countSpan = li.querySelector(".listenCount");
              if (countSpan && data.listenCount !== undefined) {
                countSpan.textContent = `🎧 Écoutes : ${data.listenCount}`;
              }
            })
            .catch(err => console.error("Erreur écoute favoris :", err));
          }
        });
      });
    } catch (err) {
      document.getElementById("userFavorites").innerHTML = "<li>Erreur de chargement des favoris.</li>";
      console.error(err);
    }
  }

  document.addEventListener("click", function (e) {
    if (e.target.classList.contains("deleteBtn")) {
      targetPath = e.target.dataset.path;
      targetCard = e.target.closest(".music-card");
      isRemovingFavorite = false;
      confirmBox.classList.add("show");
    }

    if (e.target.classList.contains("removeFavBtn")) {
      targetPath = e.target.dataset.path;
      targetCard = e.target.closest(".music-card");
      isRemovingFavorite = true;
      confirmBox.classList.add("show");
    }

    if (e.target.classList.contains("no")) {
      confirmBox.style.display = "none";
      confirmBox.classList.remove("show");
      targetPath = "";
      targetCard = null;
      isRemovingFavorite = false;
    }

    if (e.target.classList.contains("yes")) {
      if (!targetPath || !targetCard) return;

      const endpoint = isRemovingFavorite ? "/api/remove-favorite" : "/api/delete";
      fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: targetPath })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          targetCard.remove();

          const successMsg = isRemovingFavorite
            ? "💙 Favori retiré avec succès"
            : "✅ Supprimée avec succès";

          deleteMsg.textContent = successMsg;
          deleteMsg.classList.add("show");
          deleteMsg.style.display = "inline-block";
          setTimeout(() => {
            deleteMsg.classList.remove("show");
            deleteMsg.style.display = "none";
            deleteMsg.textContent = "";
          }, 3000);

          if (isRemovingFavorite) {
            const favList = document.getElementById("userFavorites");
            if (!favList.querySelector(".music-card")) {
              favList.innerHTML = "<li>Aucune musique en favoris.</li>";
            }
          }
        } else {
          deleteMsg.textContent = "❌ Échec de la suppression";
          deleteMsg.style.color = "red";
        }

        confirmBox.style.display = "none";
      })
      .catch(err => {
        console.error("Erreur serveur :", err);
        deleteMsg.textContent = "❌ Erreur serveur";
        deleteMsg.style.color = "red";
        confirmBox.style.display = "none";
      });
    }
  });

  async function changePassword(e) {
    e.preventDefault();
    const oldPass = document.getElementById("oldPass").value;
    const newPass = document.getElementById("newPass").value;
    const msg = document.getElementById("msg");

    const res = await fetch("/api/change-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ oldPassword: oldPass, newPassword: newPass })
    });

    const data = await res.json();
    msg.textContent = data.message;
    msg.style.color = data.status === "success" ? "green" : "red";
  }

  function logoutUser() {
    localStorage.removeItem("moziKaUser");
    window.location.href = "login.html";
  }
  
</script>

</body>
</html>
