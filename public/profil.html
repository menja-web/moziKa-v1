<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profil utilisateur - MoziKa</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    #deleteMessage {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 15px;
    }
    .confirm-box {
      background: white;
      border: 2px solid #4a90e2;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      padding: 15px 20px;
      max-width: 300px;
      margin: 15px auto;
      text-align: center;
      display: none;
      z-index: 99;
    }
    .confirm-box p {
      margin-bottom: 10px;
      font-weight: bold;
      color: #333;
    }
    .confirm-box button {
      margin: 5px 10px;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .confirm-box .yes {
      background-color: #e74c3c;
      color: white;
    }
    .confirm-box .no {
      background-color: #ccc;
      color: #333;
    }
    .music-card {
      position: relative;
      margin-bottom: 20px;
    }
    .music-card hr {
      margin: 10px 0;
      border: none;
      border-top: 1px solid #eee;
    }
    form {
      margin: 30px auto 40px;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-width: 400px;
    }
    form input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    form button {
      background: #4a90e2;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 6px;
      width: 100%;
      font-weight: bold;
      cursor: pointer;
    }
    #msg {
      margin-top: 10px;
      text-align: center;
    }
  </style>
  <meta name="theme-color" content="#209CEE">
</head>
<body>

  <section id="feedbackZone" style="text-align:center; margin-top:20px;">
    <div id="deleteMessage" style="display:none;"></div>
  </section>

  <header>
    <h1>🎵 MoziKa</h1>
    <nav>
      <a href="./accueil.html">Accueil</a>
      <a href="upload.html">Ajouter une musique</a>
      <a href="/logout" id="logoutLink">Déconnexion</a>
    </nav>
  </header>

  <main>
    <h2>Mon Profil</h2>
    <p><strong>👋 Bienvenue :</strong> <span id="username">...</span></p>
    <p><strong>📧 E-mail :</strong> <span id="email">...</span></p>

    <form id="passwordForm" onsubmit="return false;">
      <h3 style="text-align:center; color:#4a90e2;">🔒 Modifier mon mot de passe</h3>
      <input type="password" id="oldPass" placeholder="Ancien mot de passe" required />
      <input type="password" id="newPass" placeholder="Nouveau mot de passe" required />
      <button type="submit">Changer</button>
      <p id="msg"></p>
    </form>

<main>
  <section>
    <h3>🎶 Tes musiques uploadées</h3>
    <ul id="userMusics"></ul>
  </section>

  <hr />

  <section>
    <h3>💙 Tes musiques favorites</h3>
    <ul id="userFavorites"></ul>
  </section>

  <div class="confirm-box" id="confirmBox" style="display:none;">
    <p>🗑 Supprimer cette musique ?</p>
    <button class="yes" id="confirmYes">Oui, supprimer</button>
    <button class="no" id="confirmNo">Annuler</button>
  </div>
</main>

  
<script src="/js/profil.js" defer></script>
<script src="/js/musique.js" defer></script>

</body>
</html>
