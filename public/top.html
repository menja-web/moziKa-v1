<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>🏆 Top Musiques - MoziKa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f8fc;
      padding: 20px;
      color: #333;
    }
    header {
      background: #4a90e2;
      padding: 20px;
      color: white;
      margin-bottom: 30px;
      text-align: center;
      border-radius: 10px;
    }
    h1 { font-size: 2rem; margin-bottom: 10px; }
    ul#topList {
      list-style: none;
      padding: 0;
      max-width: 800px;
      margin: 0 auto;
    }
    ul#topList li {
      background: white;
      border-left: 6px solid #4a90e2;
      padding: 15px 20px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    ul#topList li strong {
      font-size: 1.2rem;
      margin-bottom: 5px;
      color: #333;
    }
    img.cover {
      width: 100px;
      margin: 10px 0;
      border-radius: 6px;
      object-fit: cover;
    }
    audio {
      width: 100%;
      margin-top: 8px;
    }
    .download-link {
      background: #4a90e2;
      color: white;
      padding: 6px 12px;
      font-weight: bold;
      border-radius: 6px;
      text-decoration: none;
      margin-top: 8px;
      display: inline-block;
      width: fit-content;
    }
    .download-link:hover { background: #357abd; }
    .back-link {
      display: block;
      text-align: center;
      margin: 30px 0;
      color: #4a90e2;
      font-weight: bold;
      text-decoration: none;
    }
    .meta {
      font-style: italic;
      font-size: 0.9rem;
      color: #555;
      margin-top: 8px;
    }
    @media screen and (max-width: 768px) {
      ul#topList li { padding: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🏆 Top 5 des musiques les plus écoutées</h1>
    <p>Les stars montantes de MoziKa 🎶</p>
  </header>

  <ul id="topList">
    <li>Chargement des musiques...</li>
  </ul>

  <a href="accueil.html" class="back-link">← Retour à l’accueil</a>

  <script>
  window.addEventListener("DOMContentLoaded", async () => {
    const fullMap = {};
    try {
      const resAll = await fetch("/api/musics");
      const { musics } = await resAll.json();
      musics.forEach(m => { fullMap[m._id] = m; });
    } catch (err) {
      console.error("Erreur chargement musiques complètes :", err);
    }

    let topData = [];
    try {
      const resTop = await fetch("/api/top");
      const jsonTop = await resTop.json();
      topData = jsonTop.top || [];
    } catch (err) {
      console.error("Erreur chargement top :", err);
    }

    const list = document.getElementById("topList");
    if (!topData.length) {
      list.innerHTML = "<li>Aucune musique populaire trouvée.</li>";
      return;
    }
    list.innerHTML = "";

    topData.forEach((music, index) => {
      const li = document.createElement("li");
      const full = fullMap[music._id] || {};

      // Médaille 🥇🥈🥉🏅
      let medal = "⭐";
      if (index === 0) medal = "🥇";
      else if (index === 1) medal = "🥈";
      else if (index === 2) medal = "🥉";
      else if (index === 3 || index === 4) medal = "🏅";

      const uploader  = full.uploader || "Inconnu";
      const category  = full.category || "Non défini";
      const cover     = music.cover || "/images/default-cover.jpg";

      li.innerHTML = `
        <strong>${medal} #${index + 1} ${music.title}</strong>
        👤 Par ${uploader}<br>
        🎵 Genre : ${category}<br>
        <img class="cover" src="${cover}" alt="Couverture"/><br>
        <audio controls controlsList="nodownload"
               src="${music.path}"
               data-id="${music._id}"></audio>
        <a class="download-link"
           href="${music.path}"
           download>
          📥 Télécharger
        </a>
        <div class="meta">
          🎧 Écoutes : <span class="listenCount">${music.listenCount || 0}</span> ·
          📥 Téléchargements : <span class="downloadCount">${music.downloadCount || 0}</span>
        </div>
      `;
      list.appendChild(li);

      const audio        = li.querySelector("audio");
      const downloadLink = li.querySelector(".download-link");
      const dlSpan       = li.querySelector(".downloadCount");
      const listenSpan   = li.querySelector(".listenCount");

      downloadLink.addEventListener("click", async () => {
        try {
          const res = await fetch("/api/download", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: music._id })
          });
          const d = await res.json();
          if (d.status === "success") dlSpan.textContent = d.count;
        } catch (e) {
          console.error("Erreur téléchargement top :", e);
        }
      });

      let timer, counted;
      audio.addEventListener("play", () => {
        clearTimeout(timer);
        counted = false;
        timer = setTimeout(async () => {
          if (!counted) {
            try {
              const res = await fetch("/api/listen", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: music._id })
              });
              const d = await res.json();
              if (d.status === "success") {
                counted = true;
                listenSpan.textContent = d.count;
              }
            } catch (e) {
              console.error("Erreur comptage écoute :", e);
            }
          }
        }, 15000);
      });
      audio.addEventListener("pause", () => clearTimeout(timer));
      audio.addEventListener("ended", () => {
        const audios = list.querySelectorAll("audio");
        const next = audios[index + 1];
        if (next) next.play();
      });
    });
  });
  </script>
</body>
</html>
