<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link 
    rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/slim-select@2.8.1/dist/slimselect.min.css"
  >
  <title>Uploader une musique - MoziKa</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f7f9fc;
      padding: 40px;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #4a90e2;
      margin-bottom: 30px;
    }
    form {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      position: relative;
    }
    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
    }
    input[type="text"],
    input[type="email"],
    select,
    input[type="file"],
    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      background: #4a90e2;
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #357abd;
    }
    .nav {
      text-align: center;
      margin-bottom: 30px;
    }
    .nav a {
      display: inline-block;
      background-color: #4a90e2;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
      transition: background 0.3s ease;
    }
    .nav a:hover {
      background-color: #357abd;
    }
    #uploadMessage {
      text-align: center;
      font-weight: bold;
      font-size: 1.2em;
      margin-top: 20px;
      transition: opacity 0.5s ease;
    }
    @media (max-width: 600px) {
      body { padding: 20px; }
      form { padding: 20px; }
      .nav a {
        display: block;
        margin: 10px auto;
        width: 80%;
      }
      h1 { font-size: 1.5rem; }
      label, input, select, button {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <h1>📤 Uploader une musique</h1>
  <div class="nav">
    <a href="accueil.html">Accueil</a>
  </div>

  <form id="uploadForm" action="/api/upload" method="POST" enctype="multipart/form-data">
    <label for="title">Titre de la musique</label>
    <input type="text" name="title" id="title" required />

    <label for="uploader_email">Votre email (auto-détecté)</label>
    <input type="email" name="uploader_email" id="uploader_email" readonly />

    <label for="category">Catégorie musicale</label>
    <select name="category" id="category" >
      <option value="">-- Choisir un genre --</option>
    </select>

    <label for="musicFile">Fichier audio (.mp3)</label>
    <input type="file" name="musicFile" id="musicFile" accept=".mp3" required />

    <label for="coverFile">Image de couverture</label>
    <input type="file" name="coverFile" id="coverFile" accept=".jpg,.jpeg,.png" required />

    <button type="submit">Envoyer</button>
    <p id="uploadMessage"></p>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/slim-select@2.8.1/dist/slimselect.min.js"></script>
  <script>
    const baseUrl = 'http://localhost:3000';
    const uploadForm = document.getElementById('uploadForm');
    const uploaderEmailInput = document.getElementById('uploader_email');
    const uploadMessage = document.getElementById('uploadMessage');
    const categorySelect = document.getElementById('category');

    // 1) Initialiser la liste des genres
    const genres = [
      "Rap","Pop","Rock","Jazz","Classique","Instrumental","Gospel",
      "Afrobeat","Amapiano","Reggae","Kilalaky","Tapiky","Slow",
      "Danchall","Afropop","Trap","Drill","Slam","Acoustic",
      "Hira Gasy","Vakodrazana","Autre"
    ];
    genres.forEach(g => {
      const opt = document.createElement('option');
      opt.value = g;
      opt.textContent = g;
      categorySelect.appendChild(opt);
    });
    new SlimSelect({
      select: '#category',
      placeholder: 'Choisis ton style musical',
      searchPlaceholder: '🔍 Rechercher un genre…',
      searchText: 'Aucun genre trouvé',
      allowDeselect: true
    });

  fetch("/api/get-session", { credentials: "include" })
    .then(res => res.json())
    .then(data => {
      if (data.status !== "success" || !data.user) {
        window.location.href = "login.html"; // redirection si non connecté
        return;
      }

      // Remplissage automatique de l’email
      document.getElementById("uploader_email").value = data.user.email;

      // Optionnel : afficher le nom d’utilisateur quelque part
      // document.getElementById("username").textContent = data.user.username;
    });
    
    // 2) Champ personnalisé "Autre"
    const customBox = document.createElement("div");
    const customInput = document.createElement("input");
    customBox.style.display = "none";
    customInput.type = "text";
    customInput.name = "category";
    customInput.placeholder = "Précise ton genre musical…";
    customInput.style.cssText = `
      width:100%; margin-bottom:20px; padding:10px;
      border:1px solid #ccc; border-radius:6px; font-size:1rem;
    `;
    customBox.appendChild(customInput);
    categorySelect.parentNode.insertBefore(customBox, categorySelect.nextSibling);

    categorySelect.addEventListener("change", () => {
      if (categorySelect.value === "Autre") {
        customBox.style.display = "block";
        categorySelect.disabled = true;
      } else {
        customBox.style.display = "none";
        customInput.value = "";
        categorySelect.disabled = false;
      }
    });
  // 👉 3) Validation avant soumission
  uploadForm.addEventListener("submit", function (e) {
    if (categorySelect.value === "Autre" && customInput.value.trim() === "") {
      e.preventDefault();
      alert("Tu dois préciser ton genre musical si tu choisis 'Autre'.");
      customInput.focus();
    } else if (categorySelect.value === "") {
      e.preventDefault();
      alert("Choisis une catégorie musicale.");
      categorySelect.focus();
    }
  });
    // 3) Récupérer l’email utilisateur
    const baseUrl = "https://mozika-gasy.onrender.com";
async function fetchUserInfo() {
  try {
    const res = await fetch(`${baseUrl}/api/get-session`, {
      credentials: 'include'
    });
    const data = await res.json();

    if (data.status !== 'success' || !data.user) {
      window.location.href = 'login.html';
      return;
    }

    uploaderEmailInput.value = data.user.email || '';
  } catch (err) {
    console.error('Erreur chargement session :', err);
    window.location.href = 'login.html';
  }
}


    // 4) Soumission du formulaire (avec redirect)
    uploadForm.addEventListener('submit', async e => {
      e.preventDefault();
      uploadMessage.textContent = '';

      const formData = new FormData(uploadForm);
      formData.delete('uploader_email');

      // Sélection du genre (select ou input personnalisé)
      const selectedGenre = (
        categorySelect.disabled && customInput.value.trim()
      ) ? customInput.value.trim() : categorySelect.value;

      // Éviter un tableau, n'envoyer qu'une string
      formData.delete('category');
      formData.append('category', selectedGenre);
        const baseUrl = "https://mozika-gasy.onrender.com";
      try {
        const res = await fetch(`${baseUrl}/api/upload`, {
          method: 'POST',
          credentials: 'include',
          body: formData
        });
        const json = await res.json();

        if (json.status === 'success') {
          // reset + redirection vers l'accueil
          uploadForm.reset();
          customBox.style.display = 'none';
          categorySelect.disabled = false;
          window.location.href = 'accueil.html';
        } else {
          uploadMessage.textContent = json.message;
          uploadMessage.style.color = 'red';
        }
      } catch (err) {
        uploadMessage.textContent = 'Erreur upload : ' + err.message;
        uploadMessage.style.color = 'red';
      }
    });

    // Initialisation au chargement
    window.addEventListener('DOMContentLoaded', fetchUserInfo);
  </script>
</body>
</html>
